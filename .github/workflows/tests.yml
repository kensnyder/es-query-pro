name: build
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # See docs/rules/update-elasticsearch-test-matrix.md for how these
        # versions are chosen and how to refresh them.
        es-version: ["9.0.8", "9.4.9", "9.5.6"]

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.es-version }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          # trial license: rrf/linear retriever tests need it
          xpack.license.self_generated.type: trial
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v7

      - name: 🧅 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ⬇️ Install dependencies
        run: bun install

      - name: 🔎 Biome lint and format check
        run: bunx biome ci .
        continue-on-error: true

      - name: 🏃 Run tests against Elasticsearch ${{ matrix.es-version }}
        run: bun run coverage-lcov

      - name: ☂️ Upload to codecov
        # Must match the newest entry in matrix.es-version
        if: matrix.es-version == '9.5.6' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: ./coverage/lcov.info
